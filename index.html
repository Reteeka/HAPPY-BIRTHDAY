<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04050a">
<title>Happy Birthday</title>
<meta name="description" content="A birthday story in six chapters.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#9fc4ff; --bg1:#04050a; --bg2:#101432;
  --ink:#eef2fb; --muted:rgba(226,232,246,.7); --line:rgba(226,232,246,.22);
  --display:'Syne',system-ui,sans-serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);background:#04050a;overflow-x:hidden}

/* ---------- fixed layers ---------- */
#bg{position:fixed;inset:0;z-index:-3;background:radial-gradient(ellipse 90% 70% at 50% 105%,var(--bg2),var(--bg1) 72%)}
#webgl{position:fixed;inset:0;width:100%;height:100%;z-index:-2;display:block}
#vignette{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(2,3,8,.7) 100%)}
#grain{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.no3d #webgl{display:none}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;align-content:center;gap:1.2rem;background:#04050a;transition:opacity .9s ease,visibility .9s ease}
#loader i{display:block;width:120px;height:1px;background:rgba(255,255,255,.15);position:relative;overflow:hidden}
#loader i::after{content:"";position:absolute;inset:0;background:#9fc4ff;transform:translateX(-100%);animation:load 1.4s ease-in-out infinite}
#loader span{font-size:.85rem;color:var(--muted);letter-spacing:.08em}
.loaded #loader{opacity:0;visibility:hidden}
@keyframes load{to{transform:translateX(100%)}}

/* ---------- sections ---------- */
main>[data-i]{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:0 8vw 0 7vw}

.hero{flex-direction:column;justify-content:center;text-align:center;gap:1.2rem}
.hero .kicker{font-size:clamp(.95rem,1.8vw,1.1rem);color:var(--muted);letter-spacing:.06em;opacity:0;animation:fade 1.2s ease .3s forwards}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(3rem,11vw,9.4rem);line-height:.92;letter-spacing:-.035em;text-shadow:0 0 80px color-mix(in srgb,var(--accent) 50%,transparent)}
.hero h1 .w{display:inline-block;white-space:nowrap}
.hero h1 .l{display:inline-block;opacity:0;transform:translateY(80%);animation:rise 1.1s cubic-bezier(.16,.84,.24,1) forwards;animation-delay:calc(var(--i) * 50ms + .7s)}
@keyframes rise{to{opacity:1;transform:none}}
.hero .name{font-family:var(--display);font-weight:500;font-size:clamp(1.3rem,3.6vw,2.4rem);letter-spacing:.32em;text-indent:.32em;color:var(--accent);opacity:0;animation:fade 1.2s ease 1.9s forwards}
.hero .sub{max-width:36ch;line-height:1.7;color:var(--muted);font-weight:300;opacity:0;animation:fade 1.2s ease 2.2s forwards}
.hero .date{font-size:.9rem;color:var(--muted);opacity:0;animation:fade 1.2s ease 2.4s forwards}
@keyframes fade{to{opacity:1}}
.cue{position:absolute;left:50%;bottom:4vh;transform:translateX(-50%);display:grid;justify-items:center;gap:.6rem;font-size:.8rem;color:var(--muted);letter-spacing:.1em;opacity:0;animation:fade 1s ease 3s forwards}
.cue i{width:1px;height:50px;background:linear-gradient(var(--accent),transparent);animation:drip 2.2s ease-in-out infinite;transform-origin:top}
@keyframes drip{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

.chapter.left{justify-content:flex-start}
.chapter.right{justify-content:flex-end}
.block{position:relative;width:min(450px,100%);will-change:opacity,transform}
.block::before{content:"";position:absolute;inset:-5rem -4rem;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(2,3,8,.62),transparent)}
.numeral{font-family:var(--display);font-weight:700;font-size:clamp(4.2rem,12.5vw,9.5rem);line-height:.85;letter-spacing:-.045em;color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--accent) 75%,transparent);white-space:nowrap}
.tag{display:flex;align-items:center;gap:.9rem;margin:1.2rem 0 .5rem;font-size:.92rem;font-weight:500;color:var(--accent)}
.tag::before{content:"";width:44px;height:1px;background:currentColor}
.tag em{font-style:normal;color:var(--muted);font-weight:400}
.block h2{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,3.2vw,2.35rem);line-height:1.1;letter-spacing:-.015em;margin-bottom:.8rem}
.block p{color:var(--muted);line-height:1.75;font-weight:300;font-size:1.02rem;max-width:42ch}
.photo{position:relative;margin-top:1.8rem;width:min(210px,58%);aspect-ratio:4/5;background:rgba(255,255,255,.035);border:1px solid var(--line);transform:perspective(800px) rotateY(-9deg);transform-origin:left center}
.right .photo{transform:perspective(800px) rotateY(9deg);transform-origin:right center}
.photo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.85) contrast(1.05)}
.photo .ph{height:100%;display:grid;place-items:center;align-content:center;gap:.5rem;color:var(--muted);font-size:.8rem;text-align:center;padding:1rem}
.photo i{position:absolute;width:14px;height:14px;border:1.5px solid var(--accent)}
.photo .a{top:-6px;left:-6px;border-right:0;border-bottom:0}
.photo .b{top:-6px;right:-6px;border-left:0;border-bottom:0}
.photo .c{bottom:-6px;left:-6px;border-right:0;border-top:0}
.photo .d{bottom:-6px;right:-6px;border-left:0;border-top:0}
.caption{margin-top:.7rem;font-size:.82rem;color:var(--muted)}

/* timeline + progress */
#timeline{position:fixed;right:clamp(.8rem,2vw,1.6rem);top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:16px;list-style:none}
#timeline::before{content:"";position:absolute;right:3px;top:4px;bottom:4px;width:1px;background:var(--line)}
#timeline button{all:unset;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:flex-end;gap:.7rem;font-size:.78rem;color:var(--muted)}
#timeline button span{opacity:0;transform:translateX(6px);transition:opacity .25s,transform .25s}
#timeline button:hover span,#timeline button:focus-visible span,#timeline li.on button span{opacity:1;transform:none}
#timeline i{width:7px;height:7px;border-radius:50%;background:#06070d;border:1px solid rgba(255,255,255,.6);transition:all .3s}
#timeline li.on i{background:var(--accent);border-color:var(--accent);box-shadow:0 0 14px var(--accent);transform:scale(1.5)}
#timeline button:focus-visible i{outline:2px solid #fff;outline-offset:3px}
#hud{position:fixed;left:clamp(1rem,2.4vw,2rem);bottom:clamp(1rem,2.4vw,2rem);z-index:20;display:flex;align-items:baseline;gap:.5rem;font-family:var(--display);opacity:0;pointer-events:none}
#hud b{font-size:1.7rem;font-weight:600;line-height:1}
#hud span{color:var(--muted);font-size:.9rem}
#hud em{font-style:normal;color:var(--accent);margin-left:.8rem;font-size:.9rem;font-family:var(--sans)}

/* finale */
.finale{flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:13vh 6vw 9vh!important}
.finale h2{font-family:var(--display);font-weight:700;font-size:clamp(2.4rem,7.5vw,6rem);line-height:1;letter-spacing:-.035em;text-shadow:0 0 70px color-mix(in srgb,var(--accent) 45%,transparent)}
.finale .lead{color:var(--muted);font-weight:300;max-width:40ch;margin:1rem auto 0;line-height:1.7}
.f-bottom{display:grid;justify-items:center;gap:1rem}
.hint{color:var(--muted);font-size:.88rem;font-weight:300}
.btn{display:inline-block;cursor:pointer;border:0;border-radius:999px;padding:1.05rem 2.5rem;font:600 .98rem var(--sans);letter-spacing:.02em;text-decoration:none;color:#0a0a10;
  background:linear-gradient(120deg,#fff4d6,var(--accent));box-shadow:0 14px 60px -14px var(--accent);transition:transform .25s ease,box-shadow .25s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 18px 70px -10px var(--accent)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:4px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}

/* wishes */
.wishes{position:relative;padding:22vh 7vw 7vh;background:linear-gradient(to bottom,transparent,rgba(4,5,10,.95) 26%,#04050a);text-align:center}
.wishes h3{font-family:var(--display);font-weight:700;font-size:clamp(2rem,5vw,3.6rem);line-height:1.05;letter-spacing:-.03em;max-width:16ch;margin:0 auto}
.wishes .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2.6rem;max-width:1000px;margin:3.2rem auto 0;text-align:left}
.note{border-top:1px solid var(--line);padding-top:1.3rem}
.note p{font-weight:300;font-size:1.12rem;line-height:1.7}
.note small{display:block;margin-top:1.1rem;color:var(--accent);font-size:.88rem;font-weight:500}
.letter{max-width:720px;margin:5.5rem auto 0;padding:clamp(1.6rem,4vw,3rem);text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.03);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.letter h4{font-family:var(--display);font-weight:600;font-size:1.6rem;margin-bottom:1.1rem}
.letter p{font-weight:300;font-size:1.08rem;line-height:1.85;color:var(--muted)}
.letter .sig{margin-top:1.6rem;color:var(--ink);font-weight:500}
.wishes .actions{margin-top:4rem}
.wishes footer{margin-top:4rem;color:var(--muted);font-size:.85rem;font-weight:300}

/* music */
#music{position:fixed;right:clamp(.8rem,2vw,1.5rem);bottom:clamp(.8rem,2vw,1.5rem);z-index:30;width:46px;height:46px;border-radius:50%;cursor:pointer;color:var(--ink);
  background:rgba(255,255,255,.06);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center}
#music[hidden]{display:none}
#music:focus-visible{outline:2px solid #fff;outline-offset:3px}
#music .bars{display:flex;gap:3px;align-items:flex-end;height:16px}
#music .bars i{width:2px;height:30%;background:currentColor}
#music.on .bars i{animation:eq .9s ease-in-out infinite}
#music.on .bars i:nth-child(2){animation-delay:.2s}
#music.on .bars i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}

@media (max-width:800px){
  #timeline,#hud{display:none}
  main>[data-i]{padding:0 6vw 5vh;align-items:flex-end}
  .chapter.left,.chapter.right{justify-content:center}
  .hero{align-items:center;padding-bottom:12vh!important}
  .numeral{font-size:clamp(3.4rem,17vw,5rem)}
  .tag{margin:.7rem 0 .3rem}
  .block::before{inset:-3rem -2rem}
  .block p{font-size:.95rem;line-height:1.6}
  .photo,.right .photo{width:38%;margin-top:1rem;transform:none}
  .finale{padding:9vh 6vw 6vh!important}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>

<body>
<div id="bg"></div>
<canvas id="webgl" aria-hidden="true"></canvas>
<div id="vignette"></div>
<div id="grain"></div>

<div id="loader"><i></i><span>Loading the story</span></div>

<ul id="timeline" aria-label="Story chapters"></ul>
<div id="hud" aria-hidden="true"><b id="hudN">01</b><span id="hudT">/ 06</span><em id="hudL"></em></div>
<button id="music" aria-label="Play or pause music" hidden><span class="bars"><i></i><i></i><i></i></span></button>

<main id="story"></main>
<section class="wishes" id="wishes" hidden></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';

/* =====================================================================
   1. EDIT THIS PART  -  all text, photos and colours live here
   ---------------------------------------------------------------------
   - {name} is replaced by CONFIG.name anywhere it appears.
   - Photos: put images in a /photos folder next to index.html and write
     the path, e.g. photo: "photos/baby.jpg". Leave "" for a blank frame.
   - Keep exactly 6 chapters. The 3D figure grows through these stages.
   ===================================================================== */
const CONFIG = {
  name: "Name",
  date: "Birthday date goes here",
  music: "",            // optional, e.g. "music/song.mp3"
  hero: {
    short: "Start",
    kicker: "A story in six chapters",
    subtitle: "Scroll to follow {name}\u2019s journey, from the first breath to the person standing here today."
  },
  chapters: [
    { short: "Baby",        age: "0\u20131",   unit: "years", title: "The Beginning",
      text: "Where everything started. Write a memory from the earliest years: a first photograph, a family story, a small detail only you remember.",
      photo: "", caption: "Add a caption" },
    { short: "Toddler",     age: "2\u20134",   unit: "years", title: "First Steps",
      text: "The world got bigger every day. Add a moment of curiosity, a first word, or a story that still makes the family laugh.",
      photo: "", caption: "Add a caption" },
    { short: "Child",       age: "5\u201312",  unit: "years", title: "Curious Mind",
      text: "School days, best friends and endless questions. Share a favourite memory, a game, or a place that shaped who {name} became.",
      photo: "", caption: "Add a caption" },
    { short: "Teen",        age: "13\u201317", unit: "years", title: "Finding a Voice",
      text: "Music, late nights and figuring out who to be. Add a memory from the teenage years that still feels vivid.",
      photo: "", caption: "Add a caption" },
    { short: "Young adult", age: "18\u201324", unit: "years", title: "Taking the Leap",
      text: "New cities, new rooms, bigger decisions. Write about a milestone, an achievement, or a turning point worth remembering.",
      photo: "", caption: "Add a caption" },
    { short: "Today",       age: "Now",        unit: "",      title: "Here, Today",
      text: "Present, certain and entirely your own. Say what makes {name} the person they are, and what the people around them admire most.",
      photo: "", caption: "Add a caption" }
  ],
  finale: {
    short: "Wish",
    title: "Make a wish",
    text: "Take a breath, think of what comes next, and blow out the candles.",
    button: "Blow out the candles",
    hint: "A quiet moment before the celebration",
    afterTitle: "Happy Birthday, {name}",
    afterText: "Here is to the next chapter.",
    afterButton: "Read the wishes"
  },
  wishes: {
    title: "Words from the people who matter",
    items: [
      { from: "Friend\u2019s name", text: "Write a short, heartfelt birthday wish here." },
      { from: "Family member",     text: "Write a short, heartfelt birthday wish here." },
      { from: "Another friend",    text: "Write a short, heartfelt birthday wish here." }
    ],
    letterTitle: "A personal note",
    letter: "Write your personal birthday message here. Tell {name} what they mean to you, share a favourite memory, and say what you hope the year ahead brings.",
    signature: "With love, Your name",
    replay: "Watch the story again",
    footer: "Made with love"
  }
};

/* =====================================================================
   2. ENGINE  (no need to edit below this line)
   ===================================================================== */
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fill = s => String(s).replace(/\{name\}/g, CONFIG.name);
const sm = t => t * t * (3 - 2 * t);
const clamp = (v, a, b) => Math.min(b === undefined ? 1 : b, Math.max(a === undefined ? 0 : a, v));
const html = document.documentElement;
const pad = n => String(n).padStart(2, '0');

document.title = 'Happy Birthday ' + CONFIG.name;

/* ---------- build the page ---------- */
const main = $('#story');
const hl = (word, off) => '<span class="w">' + [...word].map((c, i) => '<span class="l" style="--i:' + (i + off) + '">' + c + '</span>').join('') + '</span>';

main.insertAdjacentHTML('beforeend',
  '<section class="hero" data-i="0" id="hero">' +
    '<p class="kicker">' + esc(CONFIG.hero.kicker) + '</p>' +
    '<h1 aria-label="Happy Birthday">' + hl('Happy', 0) + ' ' + hl('Birthday', 5) + '</h1>' +
    '<p class="name">' + esc(CONFIG.name) + '</p>' +
    '<p class="sub">' + esc(fill(CONFIG.hero.subtitle)) + '</p>' +
    (CONFIG.date ? '<p class="date">' + esc(CONFIG.date) + '</p>' : '') +
    '<div class="cue"><i></i><span>Scroll</span></div>' +
  '</section>');

const camSvg = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M3 8h3l1.5-2h9L18 8h3v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>';
CONFIG.chapters.forEach((c, idx) => {
  const i = idx + 1, side = i % 2 ? 'left' : 'right';
  const pic = c.photo
    ? '<img src="' + esc(c.photo) + '" alt="' + esc(c.caption || '') + '" loading="lazy">'
    : '<div class="ph">' + camSvg + '<span>Your photo here</span></div>';
  main.insertAdjacentHTML('beforeend',
    '<section class="chapter ' + side + '" data-i="' + i + '"><article class="block">' +
      '<div class="numeral" aria-hidden="true">' + esc(c.age) + '</div>' +
      '<div class="tag">' + esc(c.short) + (c.unit ? '<em>' + esc(c.unit) + '</em>' : '') + '</div>' +
      '<h2>' + esc(c.title) + '</h2>' +
      '<p>' + esc(fill(c.text)) + '</p>' +
      '<figure><div class="photo">' + pic + '<i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>' +
      (c.caption ? '<figcaption class="caption">' + esc(c.caption) + '</figcaption>' : '') + '</figure>' +
    '</article></section>');
});

const F = CONFIG.finale;
main.insertAdjacentHTML('beforeend',
  '<section class="finale" data-i="7" id="finale">' +
    '<div class="f-top"><h2 id="fTitle">' + esc(fill(F.title)) + '</h2><p class="lead" id="fText">' + esc(fill(F.text)) + '</p></div>' +
    '<div class="f-bottom" id="fBottom"><button class="btn" id="blow">' + esc(F.button) + '</button><p class="hint">' + esc(F.hint) + '</p></div>' +
  '</section>');

const W = CONFIG.wishes;
$('#wishes').innerHTML =
  '<h3>' + esc(W.title) + '</h3><div class="grid">' +
  W.items.map(w => '<blockquote class="note"><p>' + esc(fill(w.text)) + '</p><small>' + esc(w.from) + '</small></blockquote>').join('') +
  '</div><article class="letter"><h4>' + esc(W.letterTitle) + '</h4><p>' + esc(fill(W.letter)) + '</p><p class="sig">' + esc(W.signature) + '</p></article>' +
  '<div class="actions"><button class="btn ghost" id="replay">' + esc(W.replay) + '</button></div>' +
  '<footer>' + esc(W.footer) + '</footer>';

$('#hudT').textContent = '/ ' + pad(CONFIG.chapters.length);

/* ---------- sections, anchors, scroll progress ---------- */
const sections = [...document.querySelectorAll('main > [data-i]')];
const labels = [CONFIG.hero.short].concat(CONFIG.chapters.map(c => c.short), [F.short]);
let anchors = [];

const tl = $('#timeline');
labels.forEach((l, i) => {
  tl.insertAdjacentHTML('beforeend', '<li><button type="button" data-go="' + i + '" aria-label="Go to ' + esc(l) + '"><span>' + esc(l) + '</span><i></i></button></li>');
});
const tlItems = [...tl.children];
tl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  window.scrollTo({ top: anchors[+b.dataset.go], behavior: 'smooth' });
});

function measure() {
  const vh = innerHeight;
  const max = Math.max(0, html.scrollHeight - vh);
  anchors = sections.map(s => s.offsetTop + s.offsetHeight / 2 - vh / 2);
  anchors[0] = 0;
  if ($('#wishes').hidden) anchors = anchors.map(a => Math.min(a, max));
}
function getF() {
  const y = window.scrollY;
  if (y <= anchors[0]) return 0;
  for (let i = 0; i < anchors.length - 1; i++) {
    if (y < anchors[i + 1]) return i + (y - anchors[i]) / Math.max(1, anchors[i + 1] - anchors[i]);
  }
  return anchors.length - 1;
}

/* ---------- palette and parameters per stage (0 = hero ... 7 = finale) ---------- */
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const RAW = {
  bg1:    ['#04050a','#04070d','#04090b','#06060f','#0a0610','#0c0710','#0c0906','#0c0906'],
  bg2:    ['#101432','#0e2a40','#0b3a3a','#1c1850','#3a1458','#4a1c3a','#4a3412','#5a3d10'],
  accent: ['#9fc4ff','#7fd3ff','#5ff0d0','#9a8cff','#d28cff','#ff9fb8','#ffc977','#ffd98a']
};
const PAL = {}; for (const k in RAW) PAL[k] = RAW[k].map(hex);
function M(k, f) {
  const a = PAL[k], i = Math.min(Math.floor(f), a.length - 2), t = sm(clamp(f - i));
  return a[i].map((v, j) => v + (a[i + 1][j] - v) * t);
}
const css = c => 'rgb(' + c.map(v => Math.round(v)).join(',') + ')';
function S(arr, f) {
  const i = Math.min(Math.floor(f), arr.length - 2), t = sm(clamp(f - i));
  return arr[i] + (arr[i + 1] - arr[i]) * t;
}

function applyUI(f) {

  lastUI = f;
  const st = html.style;
  st.setProperty('--accent', css(M('accent', f)));
  st.setProperty('--bg1', css(M('bg1', f)));

    c.el.style.opacity = o.toFixed(3);
    c.el.style.transform = 'translateY(' + ((1 - o) * 30).toFixed(1) + 'px)';

  });
  heroEl.style.opacity = clamp(1 - f * 2.2).toFixed(3);

    fwAny = true;
  }
  fire = function () {
    flash = 1;
    const cols = [[1, 0.85, 0.45], [1, 1, 1], [0.6, 0.8, 1], [1, 0.6, 0.8], [1, 0.7, 0.3]];
    const sx = isMobile ? 1.3 : 3.6, y0 = isMobile ? 3.6 : 2.8;
    for (let i = 0; i < 9; i++) {
      setTimeout(() => { burstAt((Math.random() * 2 - 1) * sx, y0 + Math.random() * 1.8, (Math.random() - 0.5) * 2, cols[i % cols.length]); flash = 0.6; }, i * 380);
    }
  };
  function updateFireworks(dt) {
    if (!fwAny) return;
    let alive = false;
    for (let i = 0; i < FW; i++) {
      if (fwL[i] > 0) {
        alive = true;
        fwL[i] -= dt / fwD[i];
        const drag = 1 - dt * 1.4;
        fwV[i * 3] *= drag; fwV[i * 3 + 1] = fwV[i * 3 + 1] * drag - dt * 1.8; fwV[i * 3 + 2] *= drag;
        fwP[i * 3] += fwV[i * 3] * dt; fwP[i * 3 + 1] += fwV[i * 3 + 1] * dt; fwP[i * 3 + 2] += fwV[i * 3 + 2] * dt;
        const a = Math.pow(Math.max(fwL[i], 0), 1.4) * 1.6;
        fwC[i * 3] = fwB[i * 3] * a; fwC[i * 3 + 1] = fwB[i * 3 + 1] * a; fwC[i * 3 + 2] = fwB[i * 3 + 2] * a;
      } else if (fwP[i * 3 + 1] > -900) { fwP[i * 3 + 1] = -999; fwC[i * 3] = fwC[i * 3 + 1] = fwC[i * 3 + 2] = 0; }
    }
    fwGeo.attributes.position.needsUpdate = true; fwGeo.attributes.color.needsUpdate = true;
    if (!alive) fwAny = false;
  }

  /* ===================== input / resize ===================== */
  const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  window.addEventListener('pointermove', e => { mouse.tx = e.clientX / innerWidth * 2 - 1; mouse.ty = -(e.clientY / innerHeight * 2 - 1); }, { passive: true });
  onResize3D = function () {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  };
  onResize3D();

  /* ===================== per-frame ===================== */
  let flameK = 1, camLookY = 1, camDist = 6;

  render3D = function (f, t, dt) {
    mouse.x += (mouse.tx - mouse.x) * 0.05; mouse.y += (mouse.ty - mouse.y) * 0.05;

    /* accent colour drives every glow */
    const ac = M('accent', f); accCol.setRGB(ac[0] / 255, ac[1] / 255, ac[2] / 255);
    floorM.uniforms.uColor.value.copy(accCol); shaftM.uniforms.uColor.value.copy(accCol); coreM.uniforms.uColor.value.copy(accCol);
    moteM.uniforms.uColor.value.copy(accCol); markM.color.copy(accCol); markDotM.color.copy(accCol);
    coreRingM.color.copy(accCol); coreGlow.material.color.copy(accCol); scanM.color.copy(accCol);
    dust.material.color.copy(accCol); rim.color.copy(accCol).lerp(new THREE.Color(0xffffff), 0.35);
    yearRings.forEach((r, i) => {
      r.material.color.copy(accCol);
      const lit = sm(clamp(f - (i + 0.4)));
      r.material.opacity = 0.1 + 0.75 * lit * (i === Math.round(f) - 1 ? 1 : 0.55);
    });

    /* stage placement */
    const sx = isMobile ? 0 : S(P.sx, f);
    stage.position.set(sx, isMobile ? 1.35 : 0, 0);
    stage.scale.setScalar(isMobile ? S(P.ms, f) : 1);
    floorM.uniforms.uPulse.value = clamp((f - 0.25) / 0.8);
    dust.rotation.y = t * 0.015 + f * 0.25; dust.position.y = -f * 0.12;

    /* growth */
    const grow = sm(clamp((f - 0.1) / 0.9));
    const raise = sm(clamp((f - 6.3) / 0.7));
    const breathe = 1 + Math.sin(t * 2) * 0.012;
    const H = pose(f, 0.1 + 2.45 * raise, breathe);
    const Hs = H * K;
    body.visible = grow > 0.01; body.scale.setScalar(Math.max(K * grow, 0.001));
    body.position.x = S(P.px, f);
    body.position.y = raise * Math.abs(Math.sin(t * 3)) * (blown ? 0.14 : 0.05);
    body.rotation.y = Math.sin(t * 0.5) * 0.3 + mouse.x * 0.5 - 0.35 * (sx / 1.7);

    /* motes + scanner */
    moteM.uniforms.uTime.value = t; moteM.uniforms.uH.value = H; moteM.uniforms.uAlpha.value = grow * 0.9;
    motes.scale.setScalar(Math.max(K * grow, 0.001)); motes.position.x = body.position.x; motes.visible = grow > 0.01;
    const sy = (0.5 + 0.5 * Math.sin(t * 0.9)) * Hs;
    scan.visible = grow > 0.01; scan.position.set(body.position.x, sy, 0);
    scan.scale.setScalar(0.45 + 0.14 * Hs); scanM.opacity = 0.8 * grow * (1 - Math.abs(sy / Hs - 0.5) * 1.2);

    /* shadow, ruler, marker */
    shadow.visible = grow > 0.01; shadow.position.x = body.position.x; shadow.scale.setScalar(0.45 + 0.5 * Hs); shadow.material.opacity = grow;
    const rv = grow * (1 - sm(clamp((f - 6) / 0.6)));
    const rx = isMobile ? -0.75 : -1.35 * (sx / 1.7);
    ruler.position.set(rx, 0, 0); ruler.visible = rv > 0.01; rulerM.opacity = 0.35 * rv;
    mark.position.set(rx, Hs, 0); mark.visible = rv > 0.01; markM.opacity = 0.85 * rv; markLine.scale.x = -rx * 0.7;

    /* hero core */
    const cv = clamp(1 - f * 1.15);
    core.visible = cv > 0.01; core.scale.setScalar(Math.max(cv, 0.001));
    core.position.set(0, 2.5 - f * 1.3 + Math.sin(t * 1.4) * 0.07, 0);
    coreRings.forEach((r, i) => { r.rotation.x += dt * (0.3 + i * 0.12); r.rotation.y += dt * (0.2 + i * 0.1); });

    /* cake */
    const cakeV = sm(clamp((f - 6.35) / 0.65));
    cake.visible = cakeV > 0.01; cake.scale.setScalar(Math.max(cakeV, 0.001)); cake.rotation.y = -0.3 + Math.sin(t * 0.4) * 0.12;
    flameK += ((blown ? 0 : 1) - flameK) * (1 - Math.exp(-dt * 8));
    const fk = 1 + Math.sin(t * 14) * 0.08 + Math.sin(t * 23) * 0.05;
    flames.forEach((fl, i) => { fl.visible = flameK > 0.02; fl.scale.set(0.2 * flameK, 0.42 * flameK * fk * (1 + (i % 2) * 0.06), 1); });
    candleLight.intensity = 1.0 * flameK * fk;

    /* fireworks + flash */
    updateFireworks(dt);
    flash *= Math.pow(0.04, dt);
    rim.intensity = 2.4 + flash * 4;

    /* camera: dolly with height, drift around the subject */
    const targetDist = (3.4 + 2.2 * Hs) * (isMobile ? 0.82 : 1);
    const targetLook = 0.55 + Hs * 0.42;
    camDist += (targetDist - camDist) * (1 - Math.exp(-dt * 4)); camLookY += (targetLook - camLookY) * (1 - Math.exp(-dt * 4));
    const az = (f / 7) * 1.0 - 0.5 + mouse.x * 0.12;
    camera.position.set(Math.sin(az) * camDist, camLookY + camDist * 0.11 + mouse.y * 0.25, Math.cos(az) * camDist);
    camera.lookAt(sx * 0.3, camLookY, 0);

    renderer.render(scene, camera);
  };
}

/* ---------- boot ---------- */
function onResize() { isMobile = innerWidth < 800; onResize3D(); measure(); lastUI = -9; }
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(onResize, 120); });

try {
  if (typeof THREE === 'undefined') throw new Error('three.js not loaded');
  init3D();
} catch (err) {
  console.warn('3D disabled:', err); html.classList.add('no3d'); render3D = null;
}

measure();
let fS = 0, last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  fS += (getF() - fS) * (1 - Math.exp(-dt * 6));
  applyUI(fS);
  if (render3D) render3D(fS, now / 1000, dt);
}
requestAnimationFrame(loop);
window.addEventListener('load', measure);

const done = () => html.classList.add('loaded');
if (document.readyState === 'complete') setTimeout(done, 500); else window.addEventListener('load', () => setTimeout(done, 500));
setTimeout(done, 4500);
})();
</script>
</body>
</html>
