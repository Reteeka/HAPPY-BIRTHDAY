<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070605">
<title>Happy Birthday, Jayesh</title>
<meta name="description" content="A story, made for Jayesh.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@300;400;500;600&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,500&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#ecd5a5; --bg1:#070605; --bg2:#1c1611;
  --ink:#fbf4e6; --muted:rgba(245,234,214,.78); --line:rgba(236,213,165,.3);
  --display:'Bodoni Moda','Playfair Display',Georgia,'Times New Roman',serif;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg1);overflow-x:hidden}

/* ---------- fixed layers ---------- */
#bg{position:fixed;inset:0;z-index:-3;background:radial-gradient(ellipse 90% 70% at 50% 105%,var(--bg2),var(--bg1) 72%)}
#bg::after{content:"";position:absolute;inset:0;background:url(marble.jpg) center/cover;mix-blend-mode:screen;opacity:.5}
#shine{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(115deg,transparent 42%,rgba(255,232,180,.07) 50%,transparent 58%);background-size:260% 100%;animation:sweep 11s ease-in-out infinite}
@keyframes sweep{0%{background-position:130% 0}100%{background-position:-30% 0}}
#webgl{position:fixed;inset:0;width:100%;height:100%;z-index:-2;display:block}
#vignette{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(3,2,8,.7) 100%)}
#grain{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.no3d #webgl{display:none}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;align-content:center;gap:1.2rem;background:var(--bg1);transition:opacity .9s ease,visibility .9s ease}
#loader i{display:block;width:120px;height:1px;background:rgba(255,255,255,.15);position:relative;overflow:hidden}
#loader i::after{content:"";position:absolute;inset:0;background:var(--accent);transform:translateX(-100%);animation:load 1.4s ease-in-out infinite}
#loader span{font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--muted)}
.loaded #loader{opacity:0;visibility:hidden}
@keyframes load{to{transform:translateX(100%)}}

/* ---------- sections ---------- */
main>[data-i]{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:0 8vw 0 7vw}

.hero{flex-direction:column;justify-content:flex-end;text-align:center;gap:.9rem;padding-bottom:11vh!important}
.hero .kicker{font-family:var(--serif);font-style:italic;font-size:clamp(1.2rem,2.4vw,1.7rem);color:var(--muted);opacity:0;animation:fade 1.2s ease .3s forwards}
.hero h1{font-family:var(--display);font-weight:600;font-size:clamp(2.7rem,9vw,7.4rem);line-height:.98;letter-spacing:-.02em;color:#f6e6bf;text-shadow:0 0 80px color-mix(in srgb,var(--accent) 50%,transparent)}
.hero h1 .w{display:inline-block;white-space:nowrap}
.hero h1 .l{display:inline-block;opacity:0;transform:translateY(80%);animation:rise 1.1s cubic-bezier(.16,.84,.24,1) forwards;animation-delay:calc(var(--i) * 50ms + .7s)}
@keyframes rise{to{opacity:1;transform:none}}
.hero .name{font-family:var(--display);font-weight:500;font-size:clamp(1.3rem,3.6vw,2.4rem);letter-spacing:.34em;text-indent:.34em;color:var(--accent);opacity:0;animation:fade 1.2s ease 1.9s forwards}
.hero .cdwrap{margin-top:.8rem;opacity:0;animation:fade 1.2s ease 2.3s forwards}
@keyframes fade{to{opacity:1}}
.cue{display:grid;justify-items:center;gap:.6rem;margin-top:1.4rem;font-size:.85rem;color:var(--muted);opacity:0;animation:fade 1s ease 3s forwards}
.cue i{width:1px;height:42px;background:linear-gradient(var(--accent),transparent);animation:drip 2.2s ease-in-out infinite;transform-origin:top}
@keyframes drip{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

/* countdown */
.cd{display:flex;gap:clamp(1rem,3.2vw,2.4rem);justify-content:center}
.cd div{display:grid;justify-items:center;min-width:3ch}
.cd b{font-family:var(--display);font-weight:600;font-size:clamp(1.9rem,5vw,3.4rem);font-variant-numeric:tabular-nums;line-height:1}
.cd span{font-size:.78rem;color:var(--muted);margin-top:.45rem}
.cd-note{color:var(--accent);font-size:.98rem;margin-top:.9rem;text-align:center}

/* ornament */
.orn{position:relative;display:block;width:150px;height:1px;margin:.3rem auto;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.orn::after{content:"";position:absolute;left:50%;top:-3px;width:7px;height:7px;background:var(--accent);transform:translateX(-50%) rotate(45deg)}

/* chapters */
.chapter.left{justify-content:flex-start}
.chapter.right{justify-content:flex-end}
.block{position:relative;width:min(440px,100%);will-change:opacity,transform}
.block::before{content:"";position:absolute;inset:-5rem -4rem;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(3,2,8,.66),transparent)}
.numeral{font-family:var(--display);font-weight:700;font-size:clamp(4.2rem,12vw,9rem);line-height:.85;letter-spacing:-.045em;font-weight:500;color:color-mix(in srgb,var(--accent) 13%,transparent);-webkit-text-stroke:1px color-mix(in srgb,var(--accent) 65%,transparent)}
.block h2{font-family:var(--display);font-weight:600;font-size:clamp(1.55rem,3vw,2.2rem);line-height:1.12;letter-spacing:-.015em;margin:1.1rem 0 .8rem}
.block p{color:var(--muted);line-height:1.75;font-weight:300;font-size:1.02rem;max-width:42ch}
.fb{display:none}
.no3d .fb,.photofail .fb{display:flex;gap:.6rem;margin-top:1.2rem}
.fb img{width:48%;max-height:240px;object-fit:cover;border-radius:3px}

/* timeline + progress */
#timeline{position:fixed;right:clamp(.8rem,2vw,1.6rem);top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:11px;list-style:none}
#timeline::before{content:"";position:absolute;right:3px;top:4px;bottom:4px;width:1px;background:var(--line)}
#timeline button{all:unset;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:flex-end;gap:.7rem;font-size:.78rem;color:var(--muted)}
#timeline button span{opacity:0;transform:translateX(6px);transition:opacity .25s,transform .25s;white-space:nowrap}
#timeline button:hover span,#timeline button:focus-visible span,#timeline li.on button span{opacity:1;transform:none}
#timeline i{width:7px;height:7px;border-radius:50%;background:#07060d;border:1px solid rgba(255,255,255,.6);transition:all .3s}
#timeline li.on i{background:var(--accent);border-color:var(--accent);box-shadow:0 0 14px var(--accent);transform:scale(1.5)}
#timeline button:focus-visible i{outline:2px solid #fff;outline-offset:3px}
#hud{position:fixed;left:clamp(1rem,2.4vw,2rem);bottom:clamp(1rem,2.4vw,2rem);z-index:20;display:flex;align-items:baseline;gap:.5rem;font-family:var(--display);opacity:0;pointer-events:none}
#hud b{font-size:1.7rem;font-weight:600;line-height:1}
#hud span{color:var(--muted);font-size:.9rem}

/* finale */
.finale{flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:12vh 6vw 8vh!important}
.finale h2{font-family:var(--display);font-weight:700;font-size:clamp(2.3rem,7vw,5.4rem);line-height:1;letter-spacing:-.035em;text-shadow:0 0 70px color-mix(in srgb,var(--accent) 45%,transparent)}
.finale .lead{font-family:var(--serif);font-style:italic;font-size:clamp(1.15rem,2.3vw,1.6rem);color:var(--muted);max-width:34ch;margin:.9rem auto 1.4rem;line-height:1.45}
.f-bottom{display:grid;justify-items:center;gap:.9rem}
.hint{color:var(--muted);font-size:.9rem;font-weight:300}
.wed{color:var(--accent);font-size:.95rem}
.btn{display:inline-block;cursor:pointer;border:0;border-radius:999px;padding:1.05rem 2.5rem;font:600 .98rem var(--sans);letter-spacing:.02em;text-decoration:none;color:#14080d;
  background:linear-gradient(120deg,#fff0d6,var(--accent));box-shadow:0 14px 60px -14px var(--accent);transition:transform .25s ease,box-shadow .25s ease,opacity .25s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 18px 70px -10px var(--accent)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:4px}
.btn:disabled{cursor:not-allowed;opacity:.55;background:rgba(255,255,255,.1);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}

/* letter */
.wishes{position:relative;padding:22vh 7vw 7vh;background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--bg1) 95%,transparent) 26%,var(--bg1));text-align:center}
.wishes h3{font-family:var(--display);font-weight:700;font-size:clamp(2rem,5vw,3.6rem);line-height:1.05;letter-spacing:-.03em;max-width:16ch;margin:0 auto}
.letter{max-width:700px;margin:3.4rem auto 0;padding:clamp(1.8rem,4.5vw,3.4rem);text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.035);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.letter p{font-family:var(--serif);font-size:clamp(1.25rem,2.2vw,1.5rem);line-height:1.6;color:var(--ink);margin-bottom:1.15rem}
.letter .sig{font-style:italic;color:var(--accent);margin:1.8rem 0 0}
.wishes h4{font-family:var(--display);font-weight:600;font-size:1.4rem;margin:5rem 0 0}
.wishes .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2.4rem;max-width:1000px;margin:2.4rem auto 0;text-align:left}
.note{border-top:1px solid var(--line);padding-top:1.2rem}
.note p{font-family:var(--serif);font-size:1.3rem;line-height:1.5}
.note small{display:block;margin-top:1rem;color:var(--accent);font-size:.88rem;font-weight:500}
.closing{font-family:var(--serif);font-style:italic;font-size:clamp(1.5rem,3.4vw,2.4rem);margin:6rem auto 0;max-width:24ch;line-height:1.3}
.wishes .actions{margin-top:3rem}
.wishes footer{margin-top:4rem;color:var(--muted);font-size:.85rem;font-weight:300}

/* incoming-call gate */
html.gated,html.gated body{overflow:hidden}
html:not(.go) .hero *{animation-play-state:paused!important}
#gate{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;text-align:center;padding:2rem;
  background:radial-gradient(ellipse at 50% 35%,var(--bg2),var(--bg1) 70%);transition:opacity 1s ease,visibility 1s ease,transform 1s ease}
#gate.gone{opacity:0;visibility:hidden;transform:scale(1.06)}
.g-ring{position:relative;width:150px;height:150px;display:grid;place-items:center;margin-bottom:1.2rem}
.g-ring i{position:absolute;inset:0;border-radius:50%;border:1px solid var(--accent);opacity:0;animation:ripple 2.6s ease-out infinite}
.g-ring i:nth-child(2){animation-delay:.85s}
.g-ring i:nth-child(3){animation-delay:1.7s}
@keyframes ripple{0%{transform:scale(.8);opacity:.7}100%{transform:scale(2.3);opacity:0}}
.g-av{width:128px;height:128px;border-radius:50%;overflow:hidden;border:2px solid var(--accent);display:grid;place-items:center;font:600 2.6rem var(--display);color:#14080d;background:linear-gradient(135deg,#fff0d6,var(--accent));box-shadow:0 0 60px -6px var(--accent)}
.g-av img{width:100%;height:100%;object-fit:cover;display:block}
.g-name{font-family:var(--display);font-weight:700;font-size:clamp(2rem,6vw,3rem);letter-spacing:-.02em}
.g-sub{color:var(--muted)}
.g-note{font-family:var(--serif);font-style:italic;font-size:1.35rem;color:var(--accent);margin-top:.6rem;max-width:26ch;line-height:1.35}
.g-btns{display:flex;gap:3.2rem;margin-top:3rem}
.g-btn{width:72px;height:72px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:#fff;transition:transform .2s}
.g-btn:hover{transform:scale(1.08)}
.g-btn:focus-visible{outline:2px solid #fff;outline-offset:4px}
.g-btn svg{width:30px;height:30px;fill:currentColor}
.g-btn.acc{background:#2fbf71;animation:ring 1.8s ease-in-out infinite}
.g-btn.dec{background:#e5484d}
.g-btn.dec svg{transform:rotate(135deg)}
.g-btn.nope{animation:nope .5s ease}
@keyframes ring{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(-14deg)}20%{transform:rotate(14deg)}30%{transform:rotate(-10deg)}40%{transform:rotate(10deg)}50%{transform:rotate(0)}}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.g-hint{color:var(--muted);font-size:.9rem;margin-top:.5rem;min-height:1.4em}

/* home quote + letter reveal */
.block .quote{font-family:var(--serif);font-style:italic;font-size:clamp(1.55rem,2.9vw,2.15rem);line-height:1.28;color:var(--ink);margin:0 0 1rem;max-width:18ch}
.quote .r{visibility:hidden}
.letter p{opacity:0;transform:translateY(14px);transition:opacity 1.3s ease,transform 1.3s ease}
.letter p.in{opacity:1;transform:none}
.letter .pull{color:var(--accent);font-style:italic;font-size:clamp(1.5rem,2.8vw,1.9rem);border-left:1px solid var(--accent);padding-left:1.1rem}

/* open-when envelopes */
.whenSub{color:var(--muted);margin-top:.6rem}
.when{max-width:1000px;margin:2.4rem auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.6rem;text-align:left}
.env{position:relative;min-height:330px;perspective:1100px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.env:focus-visible{outline:2px solid #fff;outline-offset:5px}
.env .in{position:absolute;inset:0;transition:transform 1s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.env.open .in{transform:rotateY(180deg)}
.env .f,.env .b{position:absolute;inset:0;border-radius:6px;padding:1.5rem;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.env .f{display:grid;align-content:end;gap:.3rem;overflow:hidden;color:#3b2a22;background:linear-gradient(160deg,#f6e7d5,#e3c9aa);box-shadow:0 26px 50px -22px rgba(0,0,0,.7)}
.env .f::before{content:"";position:absolute;left:0;right:0;top:0;height:60%;background:linear-gradient(165deg,#efdcc4,#d3b793);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.env .seal{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ff8fa8,#a81c3b);box-shadow:0 8px 18px rgba(0,0,0,.4)}
.env .seal svg{width:24px;height:24px;fill:#ffe3ea}
.env.locked .seal{background:radial-gradient(circle at 35% 30%,#8a8f9c,#444955)}
.env.locked .seal svg{fill:#e8ebf2}
.env .lbl{position:relative;font-family:var(--display);font-weight:600;font-size:1.12rem;line-height:1.2}
.env .sub{position:relative;font-size:.82rem;opacity:.7}
.env .b{transform:rotateY(180deg);overflow:auto;color:#3b2a22;background:linear-gradient(160deg,#fffaf0,#f3e6d0);box-shadow:0 26px 50px -22px rgba(0,0,0,.7)}
.env .b small{display:block;font-style:italic;color:#9a5a2c;margin-bottom:.7rem;font-size:.9rem}
.env .b p{font-family:var(--serif);font-size:1.22rem;line-height:1.45}
.env.nope{animation:nope .5s ease}
.f-top h2,.f-top .lead{text-shadow:0 2px 26px rgba(0,0,0,.9)}

/* music */
#music{position:fixed;right:clamp(.8rem,2vw,1.5rem);bottom:clamp(.8rem,2vw,1.5rem);z-index:30;width:46px;height:46px;border-radius:50%;cursor:pointer;color:var(--ink);
  background:rgba(255,255,255,.06);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center}
#music[hidden]{display:none}
#music:focus-visible{outline:2px solid #fff;outline-offset:3px}
#music .bars{display:flex;gap:3px;align-items:flex-end;height:16px}
#music .bars i{width:2px;height:30%;background:currentColor}
#music.on .bars i{animation:eq .9s ease-in-out infinite}
#music.on .bars i:nth-child(2){animation-delay:.2s}
#music.on .bars i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}

@media (max-width:800px){
  #timeline,#hud{display:none}
  main>[data-i]{padding:0 6vw 5vh;align-items:flex-end}
  .chapter.left,.chapter.right{justify-content:center}
  .hero{align-items:center;padding-bottom:9vh!important}
  .numeral{font-size:clamp(3.2rem,16vw,4.8rem)}
  .block h2{margin:.7rem 0 .5rem}
  .block::before{inset:-3rem -2rem}
  .block p{font-size:.95rem;line-height:1.6}
  .finale{padding:9vh 6vw 6vh!important}
  .cd{gap:1rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>

<body>
<div id="bg"></div>
<canvas id="webgl" aria-hidden="true"></canvas>
<div id="vignette"></div>
<div id="shine"></div>
<div id="grain"></div>

<div id="loader"><i></i><span>Made for you</span></div>

<ul id="timeline" aria-label="Chapters"></ul>
<div id="hud" aria-hidden="true"><b id="hudN">01</b><span id="hudT">/ 12</span></div>
<button id="music" aria-label="Play or pause music" hidden><span class="bars"><i></i><i></i><i></i></span></button>

<main id="story"></main>
<section class="wishes" id="wishes" hidden></section>


<script>window.CALLER_PHOTO="caller.jpg";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';

/* =====================================================================
   1. EDIT THIS PART  -  every word on the site lives here
   ---------------------------------------------------------------------
   - photos.js holds the 18 photos (in order). Chapters point to them by
     number: photos: [0, 1] means the 1st and 2nd photo.
   - {name} is replaced by CONFIG.name everywhere.
   - Keep 12 chapters. You may leave "photos" empty for a words-only chapter.
   ===================================================================== */
const CONFIG = {
  name: "Jayesh",
  theme: "noir",                                // luxury look: "noir" (black marble + gold), "emerald", "burgundy" or "midnight"
  music: "",                                   // optional, e.g. "music/our-song.mp3"
  birthday: { month: 11, day: 12, firstYear: 2026 },   // candles unlock on this date
  wedding:  { year: 2027, month: 1, day: 21, label: "21 January 2027" },
  ratios: [0.5625, 0.5625, 0.5625, 0.5625, 0.5625, 0.5625, 0.5625, 1.5, 0.5625, 1.7778, 0.5625, 0.5625, 0.5625, 0.5625, 0.695, 0.5625, 0.5625, 0.8],                          // width/height of each photo (do not edit)

  gate: {
    caller: "Wifey",
    sub: "is calling you\u2026",
    note: "This time, it is my turn to call you.",
    hint: "Tap the green button to answer",
    declineMsg: "You cannot decline me, Jayesh."
  },

  hero: {
    kicker: "For Jayesh, with all my love",
    cue: "Scroll to begin our story"
  },

  chapters: [
    { short: "Yes", photos: [0, 1], title: "The day we said yes",
      text: "Some answers arrive quietly. Ours came with shy smiles and gift bags that said \u201ctime to celebrate\u201d, because it was. We said yes to each other, and the world went calm and certain. That was the day a maybe became forever." },
    { short: "Wrong turn", photos: [2], title: "The best wrong turn",
      text: "You came to pick me up and the plan was Lonavala. We ended up in Mumbai, by accident, with songs playing that were almost our taste and not quite. We were still learning each other, one song at a time, and I would have taken any wrong road with you." },
    { short: "Until morning", photos: [3], title: "Until the sun came up",
      text: "A whole day, a whole night, and we got home as the morning arrived. Then the rain, and your car, which you love almost as much as you love me (almost), and a kiss I still replay. Somewhere in that night I stopped wondering and started knowing." },
    { short: "The rings", photos: [4, 5], title: "Rings, and the truest thing I said",
      text: "We went to choose our engagement rings. My hand in yours, and in the middle of everything I told you I really love you. It was the truest thing I had ever said out loud. Then a little mirror caught us laughing, and I wished I could keep that reflection forever." },
    { short: "Henna", photos: [6], title: "Henna and happiness",

function tick() {
  const now = new Date(), y = now.getFullYear(), DAY = 864e5;
  let target = new Date(y, BD.month - 1, BD.day), today = false;
  if (now >= target && now - target < DAY) today = true;
  else if (now >= target) target = new Date(y + 1, BD.month - 1, BD.day);
  const diff = today ? 0 : Math.max(0, target - now);
  const v = { d: Math.floor(diff / DAY), h: Math.floor(diff / 36e5) % 24, m: Math.floor(diff / 6e4) % 60, s: Math.floor(diff / 1e3) % 60 };
  document.querySelectorAll('.cd').forEach(cd => {
    for (const u in v) { const b = $('[data-u="' + u + '"]', cd); const t = u === 'd' ? String(v.d).padStart(2, '0') : pad(v[u]); if (b.textContent !== t) b.textContent = t; }

  const note = today ? 'Today is your day.' : 'until your birthday';
  document.querySelectorAll('.cd-note').forEach(n => { n.textContent = note; });

  const wd = Math.ceil((new Date(WD.year, WD.month - 1, WD.day) - now) / DAY);
  $('#wed').textContent = wd > 0 ? (wd + (wd === 1 ? ' day' : ' days') + ' until I become Ritika Jayesh Ukey') : 'Married to my best friend, 21 January 2027';

  const unlocked = PREVIEW || now >= unlockAt;
  if (!blown) {
    const b = $('#blow'); b.disabled = !unlocked;
    b.textContent = unlocked ? F.button : F.lockedButton.replace('{date}', unlockLabel);
    $('#fHint').textContent = unlocked ? F.hint : F.lockedHint;
  }
  if (wasUnlocked === false && unlocked) fire();
  wasUnlocked = unlocked;
}

  function spawn(x, y, z, vx, vy, vz, col, dur) {
    const i = fwHead++ % FW;
    fwV[i * 3] = vx; fwV[i * 3 + 1] = vy; fwV[i * 3 + 2] = vz; fwP[i * 3] = x; fwP[i * 3 + 1] = y; fwP[i * 3 + 2] = z;
    fwL[i] = 1; fwD[i] = dur; fwB[i * 3] = col[0]; fwB[i * 3 + 1] = col[1]; fwB[i * 3 + 2] = col[2]; fwAny = true;
  }
  function burstAt(x, y, z, col) {
    for (let k = 0; k < 220; k++) {
      const u = Math.random() * 2 - 1, th = Math.random() * 6.283, s = Math.sqrt(1 - u * u), sp2 = 1.6 + Math.random() * 2.6;
      spawn(x, y, z, s * Math.cos(th) * sp2, u * sp2 + 0.4, s * Math.sin(th) * sp2, col, 1.1 + Math.random() * 0.9);
    }
  }
  function heartBurst(x, y, z, col) {
    for (let k = 0; k < 260; k++) {
      const t = Math.random() * 6.283, hx = 16 * Math.pow(Math.sin(t), 3), hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t), sc = 0.17 * (0.4 + Math.random() * 0.6);
      spawn(x, y, z, hx * sc, (hy + 2) * sc, (Math.random() - 0.5) * 0.6, col, 1.5 + Math.random() * 0.9);
    }
  }
  fire = function () {
    flash = 1;
    const cols = [[1, 0.85, 0.45], [1, 0.93, 0.75], [1, 1, 1], [1, 0.78, 0.55], [1, 0.7, 0.3]];
    const cp = cake.position, sx = isMobile ? 1.4 : 3.6, y0 = cp.y + (isMobile ? 3.4 : 2.2);
    for (let i = 0; i < 11; i++) {
      setTimeout(function () {
        const x = cp.x + (Math.random() * 2 - 1) * sx, y = y0 + Math.random() * 1.8, z = cp.z + (Math.random() - 0.5) * 3;
        if (i % 3 === 1) heartBurst(x, y, z, [1, 0.72, 0.6]); else burstAt(x, y, z, cols[i % cols.length]);
        flash = 0.6;
      }, i * 380);
    }
  };
  function updateFireworks(dt) {
    if (!fwAny) return;
    let alive = false;
    for (let i = 0; i < FW; i++) {
      if (fwL[i] > 0) {
        alive = true; fwL[i] -= dt / fwD[i];
        const drag = 1 - dt * 1.4;
        fwV[i * 3] *= drag; fwV[i * 3 + 1] = fwV[i * 3 + 1] * drag - dt * 1.8; fwV[i * 3 + 2] *= drag;
        fwP[i * 3] += fwV[i * 3] * dt; fwP[i * 3 + 1] += fwV[i * 3 + 1] * dt; fwP[i * 3 + 2] += fwV[i * 3 + 2] * dt;
        const a = Math.pow(Math.max(fwL[i], 0), 1.4) * 1.6;
        fwC[i * 3] = fwB[i * 3] * a; fwC[i * 3 + 1] = fwB[i * 3 + 1] * a; fwC[i * 3 + 2] = fwB[i * 3 + 2] * a;
      } else if (fwP[i * 3 + 1] > -900) { fwP[i * 3 + 1] = -999; fwC[i * 3] = fwC[i * 3 + 1] = fwC[i * 3 + 2] = 0; }
    }
    fwGeo.attributes.position.needsUpdate = true; fwGeo.attributes.color.needsUpdate = true;
    if (!alive) fwAny = false;
  }

  /* ===================== input / resize ===================== */
  const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  window.addEventListener('pointermove', e => { mouse.tx = e.clientX / innerWidth * 2 - 1; mouse.ty = -(e.clientY / innerHeight * 2 - 1); }, { passive: true });
  onResize3D = function () {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    floatM.uniforms.uPR.value = renderer.getPixelRatio();
  };
  onResize3D();

  /* ===================== per-frame ===================== */
  const LAST = NS - 1;
  let flameK = 1, blownAt = -1;

  render3D = function (f, t, dt) {
    mouse.x += (mouse.tx - mouse.x) * 0.05; mouse.y += (mouse.ty - mouse.y) * 0.05;

    /* accent drives every glow */
    const ac = M('accent', f); accCol.setRGB(ac[0] / 255, ac[1] / 255, ac[2] / 255);
    faintM.color.copy(accCol); litM.color.copy(accCol); floorM.uniforms.uColor.value.copy(accCol); floatM.uniforms.uColor.value.copy(accCol);
    heartM.color.copy(accCol); heartGlows.forEach(m => m.color.copy(accCol)); glowMats.forEach(m => m.color.copy(accCol));
    nodeSprites.forEach(s => s.material.color.copy(accCol));
    rim.color.copy(accCol).lerp(new THREE.Color(0xffffff), 0.4);

    /* camera flight */
    const cx = S(CX, f), cy = S(CY, f), cz = S(CZ, f);
    camera.position.set(cx + mouse.x * 0.35, cy + mouse.y * 0.2, cz);
    camera.lookAt(cx * 0.6 + mouse.x * 0.8, cy - 0.1 + mouse.y * 0.1, cz - 10);
    key.position.set(cx - 4, cy + 6, cz + 6); key.target.position.set(cx, cy, cz - 8);
    rim.position.set(cx + 5, cy + 3.5, cz - 14); rim.target.position.set(cx, cy, cz - 7);
    floaters.position.set(cx, cy, cz); floatM.uniforms.uTime.value = t;
    stars.position.z = 0;

    /* lit portion of the path */
    litM.opacity = 0.85;
    tubeLit.setDrawRange(0, Math.max(3, Math.floor(tubeCount * clamp(f / LAST) / 3) * 3));

    /* photos */
    const lay = isMobile ? LAYOUT.m : LAYOUT.d;
    photoChapters.forEach(pc => {
      const show = Math.abs(f - pc.i) < 1.7; pc.g.visible = show; if (!show) return;
      const l = lay[pc.items.length];
      pc.g.position.set(CX[pc.i] + (isMobile ? 0 : pc.side * 2.0), CY[pc.i] + (isMobile ? 0.95 : 0.12) + Math.sin(t * 0.7 + pc.i) * 0.05, CZ[pc.i] - 7.5);
      pc.items.forEach((it, k) => {
        const p = l.p[k], s = Math.min(l.mw / it.userData.r, l.mh);
        it.scale.setScalar(s); it.position.set(p[0], p[1], p[2]);
        it.rotation.set(0, (isMobile ? p[3] : p[3] * pc.side) + mouse.x * 0.1, p[4]);
      });
    });

    /* hearts */
    const beat = 1 + Math.pow(Math.abs(Math.sin(t * 1.6)), 14) * 0.09;
    heartHero.visible = f < 1.6;
    heartHero.position.set(CX[0], CY[0] + (isMobile ? 1.3 : 1.05), CZ[0] - 6);
    heartHero.scale.setScalar((isMobile ? 0.62 : 0.85) * beat); heartHero.rotation.y = t * 0.35;
    const hv = Math.abs(f - babuIdx) < 1.7; house.visible = hv;
    if (hv) {
      house.position.set(CX[babuIdx] + (isMobile ? 0 : (babuIdx % 2 ? 1 : -1) * 2.0), CY[babuIdx] + (isMobile ? 0.6 : -0.25), CZ[babuIdx] - 7.5);
      house.scale.setScalar(isMobile ? 0.6 : 1.15); house.rotation.y = -0.25 + Math.sin(t * 0.5) * 0.45;
      const wb = 0.75 + (beat - 1) * 3.5; warmM.color.setRGB(2.2 * wb, 1.5 * wb, 0.6 * wb);
      miniHeart.scale.setScalar(0.3 * beat);
    }

    /* cake + floor */
    const cv = sm(clamp((f - (LAST - 0.8)) / 0.8));
    cake.visible = cv > 0.01;
    const cs = (isMobile ? 0.85 : 1.2) * Math.max(cv, 0.001);
    cake.scale.setScalar(cs);
    cake.position.set(CX[LAST], CY[LAST] - (isMobile ? 0.9 : 1.45), CZ[LAST] - 8.2);
    cake.rotation.y = -0.3 + Math.sin(t * 0.4) * 0.12 + t * 0.12;
    cake.userData.topper.visible = true; cake.userData.topper.rotation.y = t * 0.8;
    floor.position.set(cake.position.x, cake.position.y + 0.004, cake.position.z); floorM.uniforms.uAlpha.value = cv;
    flameK += ((blown ? 0 : 1) - flameK) * (1 - Math.exp(-dt * 8));
    const fk = 1 + Math.sin(t * 14) * 0.08 + Math.sin(t * 23) * 0.05;
    flames.forEach((fl, i) => { fl.visible = flameK > 0.02; fl.scale.set(0.2 * flameK, 0.42 * flameK * fk * (1 + (i % 2) * 0.06), 1); });
    candleLight.intensity = 1.0 * flameK * fk * cv;

    /* the heart of photos */
    if (blown && blownAt < 0) blownAt = t;
    const tt = blownAt < 0 ? -1 : t - blownAt;
    pheart.visible = tt >= 0; heartBig.visible = tt >= 2.4;
    if (tt >= 0) {
      const ps = isMobile ? 0.46 : 1, hb = 1 + (tt > 4 ? Math.pow(Math.abs(Math.sin(t * 1.6)), 14) * 0.03 : 0);
      pheart.position.set(CX[LAST], CY[LAST] + (isMobile ? 1.9 : 1.1), CZ[LAST] - (isMobile ? 12 : 14));
      pheart.scale.setScalar(ps * hb);
      const sx0 = (cake.position.x - pheart.position.x) / ps, sy0 = (cake.position.y + 2.2 - pheart.position.y) / ps, sz0 = (cake.position.z - pheart.position.z) / ps;
      phSlots.forEach(sl => {
        const q = clamp((tt - 1.0 - sl.d) / 1.9), e = 1 - Math.pow(1 - q, 3), g = sl.g;
        g.visible = q > 0;
        if (q > 0) {
          const arc = Math.sin(e * Math.PI);
          g.position.set(sx0 + (sl.tx - sx0) * e, sy0 + (sl.ty - sy0) * e + arc * 1.2, sz0 + (sl.tz - sz0) * e + arc * 2.5);
          g.scale.setScalar(0.2 + 1.3 * e); g.rotation.z = (1 - e) * 5 + sl.rz * e;
        }
      });
      const hp = sm(clamp((tt - 2.4) / 2));
      heartBig.position.copy(pheart.position); heartBig.position.z -= 0.6;
      heartBig.scale.setScalar(ps * 3.3 * Math.max(hp, 0.001)); heartBig.rotation.y = Math.sin(t * 0.4) * 0.4;
    }

    updateFireworks(dt);
    flash *= Math.pow(0.04, dt);
    rim.intensity = 2.2 + flash * 4;

    renderer.render(scene, camera);
  };
}

/* ---------- fallback: show photos as normal pictures if 3D or a texture fails ---------- */
let fbDone = false;
function fillFallback() {
  if (fbDone) return; fbDone = true; html.classList.add('photofail');
  document.querySelectorAll('.chapter').forEach((sec, k) => {
    const ph = CONFIG.chapters[k].photos || [];
    if (ph.length) $('.block', sec).insertAdjacentHTML('beforeend', '<div class="fb">' + ph.map(p => '<img src="' + SRC(p) + '" alt="" loading="lazy">').join('') + '</div>');
  });
}

/* ---------- boot ---------- */
function onResize() { isMobile = innerWidth < 800; onResize3D(); measure(); lastUI = -9; }
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(onResize, 120); });

try {
  if (typeof THREE === 'undefined') throw new Error('three.js not loaded');
  init3D();
} catch (err) {
  console.warn('3D disabled:', err); html.classList.add('no3d'); render3D = null;
  fillFallback();
}

measure();
let fS = 0, last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  fS += (getF() - fS) * (1 - Math.exp(-dt * 6));
  applyUI(fS);
  if (render3D) render3D(fS, now / 1000, dt);
}
requestAnimationFrame(loop);
window.addEventListener('load', measure);

const done = () => html.classList.add('loaded');
if (document.readyState === 'complete') setTimeout(done, 600); else window.addEventListener('load', () => setTimeout(done, 600));
setTimeout(done, 4500);
})();
</script>
</body>
